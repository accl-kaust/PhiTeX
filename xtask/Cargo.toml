[package]
name = "xtask"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
partex-engine = { path = "../crates/partex-engine" }
regex = "1"
serde = { version = "1", features = ["derive"] }
# (`float_roundtrip`: a number read back is the `f64` written, which the
# display lists' check compares bit for bit)
serde_json = { version = "1", features = ["float_roundtrip"] }
walkdir = "2"

[lints]
workspace = true
