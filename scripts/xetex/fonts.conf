<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- XeTeX's oracle sees TeX Live's OpenType and TrueType fonts only, the
     same list the engine's font index has (DESIGN 4.7): no system fonts. -->
<fontconfig>
  <dir>/usr/share/texmf-dist/fonts/opentype</dir>
  <dir>/usr/share/texmf-dist/fonts/truetype</dir>
  <cachedir>/tmp/partex-xetex-fc-cache</cachedir>
</fontconfig>
