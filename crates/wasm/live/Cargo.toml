[package]
name = "phitex-wasm-live"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The live engine for the browser and VS Code's builtin engine: phitex-live's document (the session, the viewer's protocol, the editor's language server) as a WASI reactor, on wasm32-wasip1-threads (its threads the host's workers on one shared memory) and on wasm32-wasip1 (single-threaded, Firefox); scripts/wasm-live.sh builds it"

[[bin]]
name = "core"
path = "src/main.rs"

[dependencies]
phitex-tex = { path = "../../engines/tex" }
phitex-live = { path = "../../editor/live" }
phitex-shelf = { path = "../../tools/shelf" }
serde_json = "1"
# (only for `observe`: its checks switched on)
phitex-defuse = { path = "../../core/defuse", optional = true }

[features]
# PhiTeX's checks that a collected value is never read again (a panic
# naming it and its reader, where a release build reads freed memory)
observe = ["dep:phitex-defuse", "phitex-defuse/observe"]
# PhiTeX's probes compiled in, switched on by the environment
# (PHITEX_TEX_TIME=1, PHITEX_OBS=1: the host's `env`)
profile = ["phitex-tex/profile"]
# the allocations counted, read by the host at `ph_mem` (src/mem.rs)
memstats = []

[lints]
workspace = true
