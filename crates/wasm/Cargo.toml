[package]
name = "phitex-wasm"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The engine as a WebAssembly program (wasm32-wasip1-threads): one document built with its threads on the host's workers, files through WASI; scripts/wasm.sh builds and runs it"

[[bin]]
name = "phitex-wasm"
path = "src/main.rs"

[dependencies]
phitex-tex = { path = "../engines/tex" }
phitex-kpse = { path = "../tools/kpse" }

[lints]
workspace = true
