[package]
name = "phitex-defuse"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "PhiTeX's side of the engine: re-exports defuse (the TeX-free def-use graph evaluator, vendored under crates/vendor/defuse and never edited here) and holds what PhiTeX adds around it without knowing TeX"

[dependencies]
defuse = { path = "../../vendor/defuse" }

[features]
# the engine's probes (defuse::obs): spans and counters, profiling only
profile = ["defuse/profile"]
# the engine's scheduler dumps (DEFUSE_DUMP, DEFUSE_DUMP_EVERY, on SIGTERM and on NoProgress)
observe = ["defuse/observe"]

[lints]
workspace = true
