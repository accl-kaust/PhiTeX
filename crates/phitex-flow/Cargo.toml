[package]
name = "phitex-flow"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "TeX as a suspending dataflow graph over content-versioned values (AGENTS_BRIEF.md)"

# The wall: phi, and the pure libraries the user approved (`tests/wall.rs`
# lists them): partex-kpse (kpathsea: texmf.cnf, ls-R, path search; no TeX
# state), the file finder a build is given; partex-otf (OpenType faces,
# shaping, TECkit: no TeX state) and partex-xdvipdfmx (XDV in, PDF out: a
# pure function of its inputs).
[dependencies]
phi = { path = "../phi" }
partex-kpse = { path = "../partex-kpse" }
partex-otf = { path = "../partex-otf" }
partex-xdvipdfmx = { path = "../partex-xdvipdfmx" }
phitex-codecs = { path = "../phitex-codecs" }
# (the CLI's global allocator, as partex-cli's: glibc's thread arenas grow
# by mprotect under the address-space lock, which 8 threads building nodes
# contend on)
tikv-jemallocator = { version = "0.6", optional = true }

[features]
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[lints]
workspace = true
