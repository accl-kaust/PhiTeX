[package]
name = "partex-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "partex"
path = "src/main.rs"

[features]
default = ["jemalloc"]
# jemalloc as the global allocator (native only): the SSA collector frees
# millions of small values while a build runs, and glibc's malloc then
# made each later keystroke slower; jemalloc does not, and builds faster.
jemalloc = ["dep:tikv-jemallocator"]
trace = ["partex-trace/trace"]
# `PARTEX_DEPS=report.txt`: record the dependency graph between input files.
deps = []

[dependencies]
partex-bibtex = { path = "../partex-bibtex" }
partex-makeindex = { path = "../partex-makeindex" }
partex-core = { path = "../partex-core" }
partex-otf = { path = "../partex-otf" }
partex-engine = { path = "../partex-engine" }
partex-incr = { path = "../partex-incr" }
partex-kpse = { path = "../partex-kpse" }
partex-trace = { path = "../partex-trace" }
partex-xdvipdfmx = { path = "../partex-xdvipdfmx" }
phitex-doc = { path = "../phitex-doc" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

[lints]
workspace = true
