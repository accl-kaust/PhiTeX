[package]
name = "partex-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "partex"
path = "src/main.rs"

[features]
trace = ["partex-trace/trace"]
# `PARTEX_DEPS=report.txt`: record the dependency graph between input files.
deps = []

[dependencies]
partex-bibtex = { path = "../partex-bibtex" }
partex-makeindex = { path = "../partex-makeindex" }
partex-core = { path = "../partex-core" }
partex-incr = { path = "../partex-incr" }
partex-kpse = { path = "../partex-kpse" }
partex-trace = { path = "../partex-trace" }

[lints]
workspace = true
