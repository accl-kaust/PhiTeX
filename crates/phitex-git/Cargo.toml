[package]
name = "phitex-git"
version = "0.0.0"
edition.workspace = true
license.workspace = true

# A project's past versions, read from its git repository (gitoxide, pure
# Rust; no checkout, no network): the baselines `phitex-diff` diffs against.
[dependencies]
phitex-diff = { path = "../phitex-diff" }
# (only what rev-parse, trees and blobs, the index and refs need: no
# network, no transport, no worktree mutation)
gix = { version = "0.89", default-features = false, features = ["sha1", "revision"] }

[lints]
workspace = true
