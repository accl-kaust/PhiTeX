[package]
name = "phitex-trace"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Measures the def-use structure of real documents from pdfTeX's e-TeX tracing log"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
phitex-source = { path = "../../core/source" }

[lints]
workspace = true
