[package]
name = "partex-trace"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# Emit `tracing` spans. Off by default: the macros then expand to nothing.
trace = ["dep:tracing"]

[dependencies]
tracing = { version = "0.1", default-features = false, features = ["attributes"], optional = true }

[lints]
workspace = true
