[package]
name = "phitex-pdf"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "pdfTeX's PDF backend: pages from shipped boxes, Type 1 fonts embedded and subset"

[features]
# timing lines (`PHITEX_TEX_TIME`), compiled out of other builds
profile = []
# dumps and checks (`PHITEX_XREF_DUMP`, `PHITEX_FAST_CHECK`)
observe = []

[dependencies]
phitex-codecs = { path = "../../codecs" }
phitex-tfm = { path = "../../fonts/tfm" }
phitex-typeset = { path = "../../core/typeset" }

[lints]
workspace = true
