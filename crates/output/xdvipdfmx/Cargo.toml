[package]
name = "phitex-xdvipdfmx"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "xdvipdfmx (dvipdfm-x 20260113) ported: XDV in, PDF out, byte for byte"

[dependencies]
phitex-codecs = { path = "../../codecs" }
phitex-ps = { path = "../ps" }
libm = "0.2"
phitex-kpse = { path = "../../tools/kpse", optional = true }

[features]
# The `xdv2pdf` test tool: std, files from a TeX Live tree, the system zlib.
cli = ["dep:phitex-kpse"]

[[bin]]
name = "xdv2pdf"
required-features = ["cli"]

[lints]
workspace = true
