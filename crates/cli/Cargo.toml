[package]
name = "phitex-cli"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The phitex command line: TeX documents built and watched on phitex-red"

[[bin]]
name = "phitex"
path = "src/main.rs"

[features]
default = ["jemalloc"]
# jemalloc as the global allocator (native only): N threads building
# nodes contend on glibc's arenas.
jemalloc = ["dep:tikv-jemallocator"]

[dependencies]
annotate-snippets = "=0.11.5"
clap = { version = "=4.6.7", features = ["derive", "wrap_help"] }
console = "=0.16.4"
indicatif = "=0.18.6"
phitex-bibtex = { path = "../tools/bibtex" }
phitex-kpse = { path = "../tools/kpse" }
phitex-makeindex = { path = "../tools/makeindex" }
phitex-xdvipdfmx = { path = "../output/xdvipdfmx" }
phitex-codecs = { path = "../codecs" }
phitex-doc = { path = "../editor/doc" }
phitex-draw = { path = "../editor/draw" }
phitex-red = { path = "../engines/red" }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tikv-jemallocator = { version = "0.6", optional = true }

[lints]
workspace = true
