[package]
name = "phitex-draw"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "What a page viewer draws: a PDF page's draw list (v2) and its glyphs' places, as the PhiTeX viewer consumes them"

[dependencies]
partex-engine = { path = "../partex-engine" }
partex-xdvipdfmx = { path = "../partex-xdvipdfmx" }
# (images re-encoded as PNGs: pure Rust, builds for wasm)
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
skrifa = { version = "=0.48.0", default-features = false, features = ["libm"] }

[lints]
workspace = true
