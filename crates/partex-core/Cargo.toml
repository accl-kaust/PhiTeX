[package]
name = "partex-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
partex-engine = { path = "../partex-engine" }
# The executor (§7.14) and, later, the adapter (§7.0). `no_std`: no threads.
partex-incr = { path = "../partex-incr", default-features = false }
partex-trace = { path = "../partex-trace" }
# The dynamic-SSA runtime (DESIGN.md 7.17), `PARTEX_SSA=1` (`ssa.rs`).
partex-ssa = { path = "../partex-ssa" }
# The build's BibTeX and makeindex, nodes of its program (`ssa/tools.rs`).
partex-bibtex = { path = "../partex-bibtex" }
partex-makeindex = { path = "../partex-makeindex" }
# The build printed as a program (`ssa::view`, DESIGN 4.3 item 7).
phitex-ir = { path = "../phitex-ir" }
# `XeTeX`'s native fonts: lookup, shaping, metrics (DESIGN 4.7).
partex-otf = { path = "../partex-otf" }
# `XeTeX`'s picture transforms (`make_rotation`).
libm = "0.2.16"
# A cold build's paragraphs, the CST's (`ssa/cold.rs`, with `std`).
phitex-syntax = { path = "../phitex-syntax", optional = true }

[dev-dependencies]
# (tests/stream.rs: the pages shipped hashed as the finished PDF's are)
phitex-draw = { path = "../phitex-draw" }

[features]
# `std` threads: an SSA build's steps on workers (`ssa/par.rs`, and a
# cold build's paragraphs, `ssa/cold.rs`). Without it the crate is
# `no_std` + `alloc` (wasm) and the steps run in turn.
std = ["dep:phitex-syntax", "partex-engine/std"]

[lints]
workspace = true
