[package]
name = "defuse"
version = "0.1.0"
edition = "2024"
description = "Incremental, parallel, field-level def-use graph evaluator"
license = "MIT OR Apache-2.0"

[dependencies]
# Only with the `observe` feature (the default build has no dependencies).
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
# Diagnostics: the engine's phase timers and counters (CLEAN_PROF), traces
# (CLEAN_DEBUG), scoped checks (CLEAN_SCOPED_CHECK) and the `obs` probes.
# Off by default; release builds compile every probe out.
profile = []
# Recording for replay (DEFUSE_RECORD=path, replayed by examples/play.rs).
# Off by default.
observe = ["dep:serde", "dep:serde_json"]

[profile.release]
debug = 1

# `cargo build --profile profiling --features profile`: release code with
# full debug info, for perf and for the `obs` probes.
[profile.profiling]
inherits = "release"
debug = true

[[example]]
name = "play"
required-features = ["observe"]
