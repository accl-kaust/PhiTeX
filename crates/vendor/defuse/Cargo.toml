[package]
name = "defuse"
version = "0.1.0"
edition = "2024"
description = "Incremental, parallel, field-level def-use graph evaluator"
license = "MIT OR Apache-2.0"

[dependencies]
# Only with the `observe` feature (the default build has no dependencies).
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"], optional = true }

[features]
# Observability probes (counters, timed spans, Chrome traces): see `obs`.
# Off by default; release builds compile every probe out.
profile = []
# Debug visibility: a scheduler dump every DEFUSE_DUMP_EVERY seconds and on
# SIGINT/SIGTERM, written to DEFUSE_DUMP (else stderr), plus per-node
# select counts; the dump is also written when an evaluation fails with
# NoProgress, Deadline or a runaway. Off by default.
observe = ["dep:serde", "dep:serde_json", "dep:tracing", "dep:tracing-subscriber"]
# The light trace (`DEFUSE_LTRACE`, see `core::ltrace`): off by default,
# when release builds carry no hook and read no environment.
ltrace = []
# The clean core (`docs/clean-core.md`), built beside the round core.
clean = []

[profile.release]
debug = 1

# `cargo build --profile profiling --features profile`: release code with
# full debug info, for perf and for the `obs` probes.
[profile.profiling]
inherits = "release"
debug = true

[[example]]
name = "play"
required-features = ["observe"]

[[test]]
name = "ltrace"
required-features = ["ltrace"]
