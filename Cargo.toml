[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

# (fat LTO, one codegen unit: the course's typing edit 30.6 -> about 28 ms
# on accl, LOG 2026-10-02; builds take longer)
[profile.release]
debug = "line-tables-only"
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true

# Debug iterations: release speed without fat LTO's link (minutes -> seconds);
# `cargo build --profile fastdev`, binary in target/fastdev/.
[profile.fastdev]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
