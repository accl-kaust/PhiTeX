# Cheap checks on GitHub's runners (docs/ci.md): formatting, clippy (with
# and without tracing), the wasm32 build of the core crates, the unit
# tests. Everything that needs TeX Live or the manual corpus runs on the
# accl cluster (scripts/accl/accl ci). No secrets, read-only token, and no
# pull_request_target: a pull request's code never runs with privileges.
name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions: read-all
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # (.cargo/config.toml links with clang and /usr/bin/mold; the runner
      # has clang, not mold)
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mold
      # (rustup reads rust-toolchain.toml: the pinned nightly, rustfmt,
      # clippy and the wasm32 target)
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      # (the live viewer's committed bundle is what viewer/src and the CLI's
      # host make: the renderer is one source, here)
      - run: PHITEX_BUNDLE_DIRECT=1 scripts/viewer-bundle.sh --check
      # (and it type-checks strict with erasable syntax only, as the
      # Overleaf extension runs it in Node with the types stripped)
      - run: PHITEX_BUNDLE_DIRECT=1 scripts/viewer-typecheck.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features partex-cli/trace -- -D warnings
      - run: >-
          cargo check --target wasm32-unknown-unknown -p partex-core -p partex-incr
          -p partex-ssa -p partex-trace -p partex-otf -p partex-xdvipdfmx
      # (without TeX Live: the tests that compare with it skip themselves)
      - run: cargo test --workspace --quiet
