# A release (docs/ci.md): a tag v1.6, v1.6.1, v1.61, … on main whose commit passed the
# gate. The CLI built for Linux (x86_64, aarch64; glibc 2.35, Ubuntu
# 22.04's) and macOS (arm64, x86_64), each a tarball phitex-<arch>-<os>.tar.gz
# (the names phitex.org/install.sh asks for), SHA256SUMS of them, signed
# with minisign, GitHub's build provenance for each, and the GitHub release
# made with all of them.
#
# Signing runs in the environment `release`: its secret MINISIGN_SECRET_KEY
# (the key file's text; MINISIGN_PASSWORD if it has one) is given only to
# a run from a v* tag, and only after the user approves that run.
#
# The frontends' checks (frontends.yml) on the x86_64 Linux binary built
# here and the browser build of this commit: Emacs, Neovim, VS Code, the
# Overleaf extension on the mock, the demo. Neither a release nor a dry
# run's signing goes ahead unless they pass; overleaf.com itself is a
# manual step (docs/ci.md).
#
# A dry run: a push to the branch release-dry (`git push github
# dev:release-dry`), or by hand (`gh workflow run release.yml`, once the
# workflow is on main): every step but the release, signed with a key made
# for the run, not the release key.
name: release
on:
  push:
    tags: ["v*"]
    branches: [release-dry]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gated:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: the tag is on main, passed the gate, and is the CLI's version
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$GITHUB_SHA tag=${GITHUB_REF_NAME#v}
          st=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" -q .status)
          case $st in identical | behind) ;; *) echo "$GITHUB_REF_NAME is not on main ($st)"; exit 1 ;; esac
          # (the gate runs on pull requests, and GitHub puts a pull request's
          # checks on its head, so the commit merging it has none: a tag on
          # main's merge commit passes through the merged pull request's
          # head when the two hold the same files, any way it was merged)
          green() { n=$(gh api "repos/$GITHUB_REPOSITORY/commits/$1/check-runs?check_name=gate" -q '[.check_runs[].conclusion] | map(select(. == "success")) | length') || exit 1; [ "$n" -gt 0 ]; }
          tree() { gh api "repos/$GITHUB_REPOSITORY/commits/$1" -q .commit.tree.sha || exit 1; }
          gated=
          if green "$sha"; then gated=$sha
          else
            heads=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" -q '.[] | select(.merged_at != null and .base.ref == "main") | .head.sha') || exit 1
            for head in $heads; do
              if [ "$(tree "$head")" = "$(tree "$sha")" ] && green "$head"; then gated=$head; break; fi
            done
          fi
          [ -n "$gated" ] || { echo "no green gate on $sha, nor on a pull request merged as it with the same files"; exit 1; }
          echo "gated: $gated"
          # (a milestone's .0 left out: Cargo's 1.61.0 is tagged 1.61, an
          # update's kept: 1.6.1 is tagged 1.6.1)
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/cli/Cargo.toml | head -1)
          case $v in *.*.0) v=${v%.0} ;; esac
          [ "$v" = "$tag" ] || { echo "the tag says $tag, crates/cli/Cargo.toml $v"; exit 1; }
          grep -q "^## $tag (" CHANGELOG.md || { echo "CHANGELOG.md has no '## $tag (date)' entry"; exit 1; }
  build:
    needs: gated
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-22.04, asset: x86_64-linux }
          - { os: ubuntu-22.04-arm, asset: aarch64-linux }
          - { os: macos-15, asset: aarch64-macos }
          # (Intel Macs' binary made on Apple silicon: Xcode carries both
          # SDKs, and Rosetta runs it for the check; GitHub's Intel runners
          # took 39 min a build against 13)
          - { os: macos-15, asset: x86_64-macos, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # (.cargo/config.toml links Linux with clang and mold)
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang mold
      - run: rustup show active-toolchain || rustup toolchain install
      - if: matrix.target != ''
        run: |
          rustup target add ${{ matrix.target }}
          softwareupdate --install-rosetta --agree-to-license
      - run: |
          t="${{ matrix.target }}"
          PHITEX_BUILT_BY=release cargo build --release --locked -p phitex-cli ${t:+--target $t}
      - run: |
          t="${{ matrix.target }}"
          out=target/${t:+$t/}release
          file "$out/phitex"
          "$out/phitex" --version
          tar -czf "phitex-${{ matrix.asset }}.tar.gz" -C "$out" phitex
      - uses: actions/upload-artifact@v4
        with:
          name: phitex-${{ matrix.asset }}
          path: phitex-${{ matrix.asset }}.tar.gz
  frontends:
    needs: build
    uses: ./.github/workflows/frontends.yml
    with:
      binary: phitex-x86_64-linux
  # (a dry run: the same sums and signing, with a key made here)
  dry-run:
    if: github.ref_type != 'tag'
    needs: [build, frontends]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: phitex-*
          merge-multiple: true
      - run: |
          cd dist
          sha256sum phitex-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          minisign -G -W -p "$RUNNER_TEMP/dry.pub" -s "$RUNNER_TEMP/dry.key"
          minisign -S -s "$RUNNER_TEMP/dry.key" -m SHA256SUMS -t "phitex dry run $GITHUB_SHA"
          minisign -Vm SHA256SUMS -p "$RUNNER_TEMP/dry.pub"
          ls -l
  publish:
    if: github.ref_type == 'tag'
    needs: [build, frontends]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: phitex-*
          merge-multiple: true
      - name: SHA256SUMS, signed
        env:
          KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          PASS: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          cd dist
          sha256sum phitex-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          [ -n "$KEY" ] || { echo "no MINISIGN_SECRET_KEY: the release is not signed"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          umask 077
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/minisign.key"
          printf '%s\n' "$PASS" | minisign -S -s "$RUNNER_TEMP/minisign.key" -m SHA256SUMS -t "phitex $GITHUB_REF_NAME"
          rm -f "$RUNNER_TEMP/minisign.key"
          minisign -Vm SHA256SUMS -p ../ci/minisign.pub
      # (GitHub's record of which run built each tarball:
      # `gh attestation verify phitex-….tar.gz -R accl-kaust/PhiTeX`)
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/phitex-*.tar.gz
      - name: the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # (CHANGELOG.md's section for this version)
          awk -v v="## ${GITHUB_REF_NAME#v} " '/^## / {on = index($0, v) == 1; next} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "PhiTeX $GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "PhiTeX $GITHUB_REF_NAME" --notes-file notes.md dist/*
